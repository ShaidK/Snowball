[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.0.0,<3.0.0"]

[project]
authors = [
  {email = "ShaidK@duck.com", name = "ShaidK"}
]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools"
]
dependencies = [
  "semver>=3.0.4"
]
description = "Following Project is integrate a GitHub Actions which validates the Semantic Version"
keywords = [
  "github",
  "poetry",
  "semver"
]
license-files = [
  "LICENSE"
]
name = "snowball"
readme = "README.md"
requires-python = ">=3.10,<4.0"
version = "0.8.0"

[project.urls]
issues = "https://github.com/ShaidK/Snowball/issues"
repository = "https://github.com/ShaidK/Snowball"

[tool.coverage.report]
exclude_also = [
  'def __repr__',
  'raise NotImplementedError',
  'if __name__ == .__main__.:',
  '@(abc\.)?abstractmethod'
]
fail_under = 95
show_missing = true

[tool.poetry]
packages = [
  {from = "src", include = "snowball"}
]

[tool.poetry.group.ci.dependencies]
pymarkdownlnt = "^0.9.34"
toml-sort = "^0.24.3"
yamllint = "^1.37.1"
ruff = "^0.14.10"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
pytest-mock = "^3.15.1"

[tool.pymarkdown]
plugins.md033.allowed_elements = "p"
plugins.md041.enabled = false

[tool.pytest.ini_options]
markers = [
  "failure",
  "success"
]
testpaths = [
  "tests"
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
indent-style = "tab"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
ignore = ["D100", "D104", "D205", "D212", "E501"]
select = ["ANN", "B", "D", "E", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.tomlsort]
no_block_comments = false
check = true
