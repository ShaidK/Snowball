---

name: Build Docker Image
on:
  push:
    branches:
      - build

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout Snowball Project Repository
        uses: actions/checkout@v6

      - name: Docker Login
        uses: docker/login-action@v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Integrate Docker Tag Environment Variable
        id: tag
        uses: actions/github-script@v8
        with:
          script: |
            core.setOutput("IMAGE_NAME", `${context.repo.owner}/${context.repo.repo}`.toLowerCase());
            core.setOutput("VERSION", (context.payload.head_commit.message.split("\n")[0].match(/^V\d+\.\d+\.\d+$/) || [""])[0]);

      - name: Build and Publish Docker Image
        uses: docker/build-push-action@v6.18.0
        with:
            file: Dockerfile
            push: false
            context: .
            tags: ${{ env.REGISTRY }}/${{ steps.tag.outputs.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}
